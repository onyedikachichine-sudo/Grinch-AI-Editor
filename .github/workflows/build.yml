
name: Build Grinch AI Editor APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

    
      - name: Fix Kotlin import
        run: |
          FILE="extracted/GrinchAIEditor/app/src/main/java/com/grinch/aieditor/MainActivity.kt"
          grep -q '^import androidx.compose.foundation.verticalScroll$' "$FILE" || sed -i '/^package /a import androidx.compose.foundation.verticalScroll' "$FILE"
         
      - name: Build APK
        run: |
          cd extracted/GrinchAIEditor
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grinch-AI-Editor-APK
          path: extracted/GrinchAIEditor/app/build/outputs/apk/debug/app-debug.apk
